# DNS interno do Docker (evita "host not found" ao arrancar o nginx antes dos outros servicos).
# Ver: https://docs.docker.com/engine/networking/#dns
server {
  listen 80;
  server_name _;
  client_max_body_size 256k;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/contact {
    set $navship_mail navship-backend:4000;
    proxy_pass http://$navship_mail;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $navship_web navship-app:3000;
    proxy_pass http://$navship_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
