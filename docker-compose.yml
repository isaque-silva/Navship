services:
  # Entrada unica: mesmo host/porta que o navegador usa; /api/contact vai para o backend SMTP.
  navship-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Porta no HOST: use uma livre no servidor (3000/8080 costumam estar ocupadas).
    # Defina NAVSHIP_GATEWAY_PORT no Dokploy (ex.: 18080, 30100) se o padrao falhar.
    ports:
      - "${NAVSHIP_GATEWAY_PORT:-18080}:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      navship-app:
        condition: service_healthy
      navship-backend:
        condition: service_healthy

  navship-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      INSTITUTIONAL_VIDEO_URL: ${INSTITUTIONAL_VIDEO_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  navship-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    # Sem env_file: o ficheiro backend/.env nao existe no clone do Git (Dokploy falhava).
    # Defina as mesmas variaveis no painel Environment do projeto ou num .env na raiz do compose.
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-4000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Site NavShip}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_DIAGNOSTICS: ${CONTACT_DIAGNOSTICS:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
