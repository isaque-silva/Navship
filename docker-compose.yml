services:
  navship-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Site NavShip}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      INSTITUTIONAL_VIDEO_URL: ${INSTITUTIONAL_VIDEO_URL:-}
      CONTACT_DIAGNOSTICS: ${CONTACT_DIAGNOSTICS:-}
