services:
  navship-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navship-app
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - .dev.vars
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
