services:
  # Entrada unica: mesmo host/porta que o navegador usa; /api/contact vai para o backend SMTP.
  navship-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Se "port is already allocated" na 3000, defina NAVSHIP_GATEWAY_PORT no Environment (ex.: 8080).
    ports:
      - "${NAVSHIP_GATEWAY_PORT:-3000}:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - navship-app
      - navship-backend

  navship-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      INSTITUTIONAL_VIDEO_URL: ${INSTITUTIONAL_VIDEO_URL:-}

  navship-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    # Sem env_file: o ficheiro backend/.env nao existe no clone do Git (Dokploy falhava).
    # Defina as mesmas variaveis no painel Environment do projeto ou num .env na raiz do compose.
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-4000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Site NavShip}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_DIAGNOSTICS: ${CONTACT_DIAGNOSTICS:-}
