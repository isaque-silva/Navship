services:
  # Entrada unica: mesmo host/porta que o navegador usa; /api/contact vai para o backend SMTP.
  navship-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - navship-app
      - navship-backend

  navship-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      INSTITUTIONAL_VIDEO_URL: ${INSTITUTIONAL_VIDEO_URL:-}

  navship-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./backend/.env
